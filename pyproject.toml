[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asphalt-material-workbench"
version = "0.2.0"
description = "Traceable scenario-based recycled asphalt material selection"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlmodel", "openpyxl", "numpy", "pandas", "scikit-learn", "scipy", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "imageio-ffmpeg"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

