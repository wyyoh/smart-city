<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>同一需求上下文里的三种调整</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007f82"/></marker></defs><style>text{font-family:Microsoft YaHei,DengXian,sans-serif;fill:#183b54}.box{fill:#fff;stroke:#9dc6c8;stroke-width:1.5}.arrow{stroke:#007f82;stroke-width:2;fill:none;marker-end:url(#arrow)}.small{font-size:14px;fill:#617d8a}.label{font-size:18px;font-weight:500}</style><rect width="1000" height="320" fill="#eef5f7"/><text x="30" y="40" font-size="23" font-weight="600">同一需求上下文里的三种调整</text><rect x="30" y="83" width="290" height="140" rx="6" class="box"/><text x="175.0" y="117" text-anchor="middle" class="label">调整目标或材料范围</text><text x="175.0" y="142" text-anchor="middle" class="small">重新确认需求</text><text x="175.0" y="167" text-anchor="middle" class="small">重算可行性并另存决策</text><rect x="355" y="83" width="290" height="140" rx="6" class="box"/><text x="500.0" y="117" text-anchor="middle" class="label">调整优先项</text><text x="500.0" y="142" text-anchor="middle" class="small">硬要求与候选范围不变</text><text x="500.0" y="167" text-anchor="middle" class="small">重排查看顺序并另存理由</text><rect x="680" y="83" width="290" height="140" rx="6" class="box"/><text x="825.0" y="117" text-anchor="middle" class="label">调整配方组成</text><text x="825.0" y="142" text-anchor="middle" class="small">保留准确父方案与原需求</text><text x="825.0" y="167" text-anchor="middle" class="small">另存设计草案，实测未知</text><text x="30" y="291" class="small">设计草案保存实际改动与意图；新配方不继承父方案实测。</text></svg>