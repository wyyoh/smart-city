<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>硬要求与偏好分开判断</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007f82"/></marker></defs><style>text{font-family:Microsoft YaHei,DengXian,sans-serif;fill:#183b54}.box{fill:#fff;stroke:#9dc6c8;stroke-width:1.5}.arrow{stroke:#007f82;stroke-width:2;fill:none;marker-end:url(#arrow)}.small{font-size:14px;fill:#617d8a}.label{font-size:18px;font-weight:500}</style><rect width="1000" height="320" fill="#eef5f7"/><text x="30" y="40" font-size="23" font-weight="600">硬要求与偏好分开判断</text><rect x="30" y="92" width="260" height="110" rx="6" class="box"/><text x="160.0" y="126" text-anchor="middle" class="label">全部硬要求检查</text><text x="160.0" y="151" text-anchor="middle" class="small">满足、不满足与待确认分开</text><rect x="370" y="92" width="260" height="110" rx="6" class="box"/><text x="500.0" y="126" text-anchor="middle" class="label">保留非支配取舍</text><text x="500.0" y="151" text-anchor="middle" class="small">多种合理方案均可比较</text><rect x="710" y="92" width="260" height="110" rx="6" class="box"/><text x="840.0" y="126" text-anchor="middle" class="label">工程师表达软偏好</text><text x="840.0" y="151" text-anchor="middle" class="small">切换查看顺序并保存理由</text><path class="arrow" d="M300 147H357"/><path class="arrow" d="M640 147H697"/><text x="500" y="243" text-anchor="middle" class="label">C3：H → K 的优先顺序变化，仍保留同一5项可行方案</text><text x="30" y="291" class="small">其他指标更好不会补偿硬要求失败；偏好变化不修改历史数值。</text></svg>