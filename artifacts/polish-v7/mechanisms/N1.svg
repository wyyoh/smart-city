<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>场景如何形成材料需求</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#007f82"/></marker></defs><style>text{font-family:Microsoft YaHei,DengXian,sans-serif;fill:#183b54}.box{fill:#fff;stroke:#9dc6c8;stroke-width:1.5}.arrow{stroke:#007f82;stroke-width:2;fill:none;marker-end:url(#arrow)}.small{font-size:14px;fill:#617d8a}.label{font-size:18px;font-weight:500}</style><rect width="1000" height="320" fill="#eef5f7"/><text x="30" y="40" font-size="23" font-weight="600">场景如何形成材料需求</text><rect x="30" y="95" width="260" height="110" rx="6" class="box"/><text x="160.0" y="129" text-anchor="middle" class="label">养护场景</text><text x="160.0" y="154" text-anchor="middle" class="small">气候、交通、病害与工法</text><rect x="370" y="95" width="260" height="110" rx="6" class="box"/><text x="500.0" y="129" text-anchor="middle" class="label">有出处的性能目标</text><text x="500.0" y="154" text-anchor="middle" class="small">规则建议与人工要求分别保存</text><rect x="710" y="95" width="260" height="110" rx="6" class="box"/><text x="840.0" y="129" text-anchor="middle" class="label">候选材料与历史证据</text><text x="840.0" y="154" text-anchor="middle" class="small">指标、适用条件、原始单元格</text><path class="arrow" d="M300 150H357"/><path class="arrow" d="M640 150H697"/><text x="30" y="291" class="small">实际采用的要求、来源与版本，贯穿同一次材料选择。</text></svg>